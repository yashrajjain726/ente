group 'io.ente.photos.platform'
version '1.0'

buildscript {
    ext.kotlin_version = '2.1.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'io.ente.photos.platform'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.res.srcDir '../../../../../packages/strings/android'
        main.assets.srcDir layout.buildDirectory.dir('generated/wallpaperAssets')
    }

    defaultConfig {
        minSdkVersion 23
    }
}

def wallpaperFonts = tasks.register('prepareWallpaperFonts', Copy) {
    from '../../../../../packages/ente_components/fonts'
    include 'Inter-Regular.ttf', 'Inter-SemiBold.ttf'
    into layout.buildDirectory.dir('generated/wallpaperAssets')
}
tasks.named('preBuild').configure { dependsOn wallpaperFonts }

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
