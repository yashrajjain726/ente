name: Change approval

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Scan changes
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.scan.outputs.categories != '[]' && 'change-approval' || 'no-approval' }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Scan changes
        id: scan
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git show origin/main:.github/checks/change-approval/check.mjs > "$RUNNER_TEMP/change-approval.mjs"
          node "$RUNNER_TEMP/change-approval.mjs" HEAD^1

  gate:
    name: Change approval
    needs: detect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    environment: ${{ needs.detect.result == 'success' && needs.detect.outputs.environment || 'no-approval' }}
    steps:
      - run: test "$SCAN_RESULT" = success
        env:
          SCAN_RESULT: ${{ needs.detect.result }}
