[package]
name = "ente_photos_napi"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep usearch disabled: its C++17 code cannot use napi-cli's GCC 4.8 toolchain.
ente-photos.workspace = true
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
# Only used for ort::init_from; the execution-provider feature set is
# declared by ente-photos' per-target sections.
ort = { workspace = true, features = ["load-dynamic"] }

[build-dependencies]
napi-build = "2"
